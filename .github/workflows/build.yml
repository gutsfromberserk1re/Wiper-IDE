name: Build Wiper IDE Binary

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ] # Triggers release build when you create a version tag
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: write # Grants permission to upload to Releases

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compile with Nuitka
      uses: Nuitka/Nuitka-Action@main
      with:
        nuitka-version: 'main'
        script-name: IDE.py
        output-file: Wiper.exe
        mode: app
        enable-plugins: pyside6
        disable-console: true
        windows-icon-from-ico: snake.ico
        include-data-files: snake.ico=snake.ico
        include-data-dir: fonts=fonts

    - name: Upload Raw Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Wiper.exe
        path: build/Wiper.exe
        archive: false

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: build/Wiper.exe
